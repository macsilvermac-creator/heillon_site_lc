<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="HEILLON">
<meta name="theme-color" content="#090E15">
<title>HEILLON Companion</title>
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
:root {
  --void: #090E15; --surface: #0D1420; --raised: #101926; --border: #1A2332; --border-hi: #2A3A50;
  --pass: #22C55E; --pass-bg: rgba(34,197,94,.08); --pass-br: rgba(34,197,94,.22);
  --fail: #EF4444; --fail-bg: rgba(239,68,68,.08); --fail-br: rgba(239,68,68,.22);
  --warn: #F59E0B; --text: #E8EEF4; --text-d: rgba(232,238,244,.6); --text-g: rgba(232,238,244,.28);
  --mono: 'IBM Plex Mono', monospace; --sans: 'IBM Plex Sans', system-ui, sans-serif;
  --safe-top: env(safe-area-inset-top); --safe-bot: env(safe-area-inset-bottom);
}
html, body { height: 100%; background: var(--void); color: var(--text); font-family: var(--sans); overflow: hidden; }
body::before { content: ''; position: fixed; inset: 0; background-image: linear-gradient(rgba(34,197,94,.012) 1px, transparent 1px), linear-gradient(90deg, rgba(34,197,94,.012) 1px, transparent 1px); background-size: 60px 60px; pointer-events: none; z-index: 0; }

/* ── IDLE SCREEN ── */
.screen { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 0; padding: calc(var(--safe-top) + 20px) 24px calc(var(--safe-bot) + 20px); z-index: 10; transition: opacity .3s ease, transform .3s ease; }
.screen.hidden { opacity: 0; pointer-events: none; transform: scale(.97); }

/* H Button */
.h-wrap { position: relative; width: 160px; height: 160px; display: flex; align-items: center; justify-content: center; cursor: pointer; }
.h-ring { position: absolute; border-radius: 50%; border: 1px solid var(--pass-br); animation: ring-idle 2.4s ease-in-out infinite; }
.h-ring:nth-child(1) { width: 160px; height: 160px; }
.h-ring:nth-child(2) { width: 120px; height: 120px; animation-delay: .5s; border-color: rgba(34,197,94,.15); }
.h-ring:nth-child(3) { width: 80px; height: 80px; animation-delay: 1s; border-color: rgba(34,197,94,.25); }
.h-center { position: relative; z-index: 2; width: 64px; height: 64px; border-radius: 50%; background: var(--raised); border: 2px solid var(--pass); display: flex; align-items: center; justify-content: center; transition: all .3s; }
.h-letter { font-size: 26px; font-weight: 700; color: var(--pass); font-family: var(--sans); line-height: 1; }
.h-wrap.blocked .h-center { border-color: var(--fail); }
.h-wrap.blocked .h-letter { color: var(--fail); }
.h-wrap.blocked .h-ring { border-color: var(--fail-br); animation-name: ring-fast; }
.h-wrap.pulsed .h-center { transform: scale(1.08); }

@keyframes ring-idle { 0%,100%{opacity:.3;transform:scale(1)} 50%{opacity:.7;transform:scale(1.04)} }
@keyframes ring-fast { 0%,100%{opacity:.6;transform:scale(1)} 50%{opacity:.2;transform:scale(1.08)} }
@keyframes fadeUp { from{opacity:0;transform:translateY(12px)} to{opacity:1;transform:none} }
@keyframes slide-in { from{opacity:0;transform:translateY(100%)} to{opacity:1;transform:none} }
@keyframes gate-in { from{opacity:0;transform:translateX(-8px)} to{opacity:1;transform:none} }
@keyframes dot-pulse { 0%,100%{opacity:1} 50%{opacity:.3} }

.idle-label { font-family: var(--mono); font-size: .65rem; letter-spacing: .2em; text-transform: uppercase; color: var(--text-g); margin-top: 28px; text-align: center; }
.idle-sub { font-family: var(--mono); font-size: .7rem; color: rgba(34,197,94,.5); margin-top: 8px; text-align: center; }
.idle-counter { display: flex; gap: 10px; margin-top: 20px; align-items: center; justify-content: center; }
.live-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--pass); animation: dot-pulse 2s ease-in-out infinite; }
.idle-events { font-family: var(--mono); font-size: .65rem; color: var(--text-g); }
.tap-hint { font-size: .72rem; color: var(--text-g); margin-top: 36px; animation: fadeUp .8s ease forwards 1s; opacity: 0; }

/* ── PANEL SCREEN ── */
#panel-screen { justify-content: flex-end; padding-bottom: 0; }
.panel-sheet { width: 100%; max-height: 88vh; background: var(--surface); border-radius: 20px 20px 0 0; border: 1px solid var(--border); border-bottom: none; overflow-y: auto; overflow-x: hidden; animation: slide-in .28s cubic-bezier(.16,1,.3,1); padding-bottom: calc(var(--safe-bot) + 16px); }
.panel-handle { width: 36px; height: 4px; background: var(--border-hi); border-radius: 2px; margin: 14px auto 0; }
.panel-header { padding: 14px 18px 0; display: flex; align-items: center; gap: 10px; }
.ph-logo { width: 26px; height: 26px; border-radius: 50%; background: var(--pass-bg); border: 1.5px solid var(--pass-br); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.ph-logo span { font-size: 12px; font-weight: 700; color: var(--pass); }
.ph-brand { font-size: 13px; font-weight: 600; color: var(--text); }
.ph-sub { font-family: var(--mono); font-size: 9px; color: var(--text-g); letter-spacing: .1em; }
.ph-count { margin-left: auto; font-family: var(--mono); font-size: 10px; color: var(--text-g); }

.verdict-row { padding: 14px 18px 0; }
.verdict-badge { display: inline-flex; align-items: center; gap: 7px; border-radius: 6px; padding: 5px 12px; }
.verdict-badge.allow { background: var(--pass-bg); border: 1px solid var(--pass-br); }
.verdict-badge.block { background: var(--fail-bg); border: 1px solid var(--fail-br); }
.verdict-dot { width: 7px; height: 7px; border-radius: 50%; animation: dot-pulse 1.8s ease-in-out infinite; flex-shrink: 0; }
.allow .verdict-dot { background: var(--pass); }
.block .verdict-dot { background: var(--fail); }
.verdict-text { font-family: var(--mono); font-size: 11px; font-weight: 700; letter-spacing: .1em; }
.allow .verdict-text { color: var(--pass); }
.block .verdict-text { color: var(--fail); }

.intent-section { padding: 12px 18px 0; }
.sec-label { font-family: var(--mono); font-size: 9px; color: var(--text-g); letter-spacing: .1em; margin-bottom: 5px; text-transform: uppercase; }
.intent-text { font-size: 14px; font-weight: 500; line-height: 1.4; }
.intent-meta { font-family: var(--mono); font-size: 10px; color: var(--text-g); margin-top: 4px; }

.gates-section { padding: 10px 18px; border-bottom: 1px solid var(--border); }
.gate-row { display: flex; align-items: center; gap: 9px; padding: 4px 0; opacity: .15; transition: opacity .15s; }
.gate-row.active { opacity: 1; animation: gate-in .28s ease-out; }
.gate-box { width: 16px; height: 16px; border-radius: 3px; border: 1px solid var(--border); display: flex; align-items: center; justify-content: center; flex-shrink: 0; transition: all .2s; }
.gate-row.active .gate-box { background: var(--pass-bg); border-color: var(--pass-br); }
.gate-check { width: 6px; height: 6px; border-radius: 50%; background: var(--pass); display: none; }
.gate-row.active .gate-check { display: block; }
.gate-label { font-size: 12px; color: var(--text-g); }
.gate-row.active .gate-label { color: var(--text-d); }

.norms-section { padding: 10px 18px; border-bottom: 1px solid var(--border); }
.norm-tags { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 5px; }
.norm-tag { font-family: var(--mono); font-size: 9px; color: var(--text-g); background: var(--raised); border: 1px solid var(--border); border-radius: 3px; padding: 2px 7px; }

.footer-section { padding: 10px 18px; }
.footer-meta { display: flex; justify-content: space-between; margin-bottom: 9px; }
.footer-meta span { font-family: var(--mono); font-size: 10px; color: var(--text-g); }
.hdr-btn { width: 100%; display: flex; align-items: center; gap: 7px; background: var(--raised); border: 1px solid var(--border); border-radius: 7px; padding: 9px 12px; cursor: pointer; margin-bottom: 8px; -webkit-appearance: none; transition: border-color .2s; }
.hdr-btn:active { border-color: var(--border-hi); }
.hdr-id { font-family: var(--mono); font-size: 10px; color: var(--text-g); flex: 1; text-align: left; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.copy-icon { font-size: 12px; color: var(--text-g); flex-shrink: 0; transition: color .2s; }
.copy-icon.ok { color: var(--pass); }

/* Tech expand */
.tech-toggle { width: 100%; display: flex; align-items: center; justify-content: center; gap: 5px; background: transparent; border: 1px solid rgba(26,35,50,.8); border-radius: 6px; padding: 6px 0; cursor: pointer; -webkit-appearance: none; margin-bottom: 2px; }
.tech-toggle-text { font-family: var(--mono); font-size: 9px; color: rgba(34,197,94,.3); letter-spacing: .1em; }
.tech-arrow { font-size: 9px; color: rgba(34,197,94,.3); transition: transform .2s; }
.tech-arrow.open { transform: rotate(180deg); }

/* Tech panel */
.tech-panel { background: #07090F; border-top: 1px solid rgba(17,25,38,.8); padding: 12px 18px 4px; }
.tech-section-lbl { font-family: var(--mono); font-size: 8px; color: rgba(34,197,94,.35); letter-spacing: .14em; text-transform: uppercase; margin-bottom: 6px; font-weight: 600; }
.tech-row { display: flex; justify-content: space-between; align-items: flex-start; padding: 2.5px 0; gap: 8px; }
.tech-key { font-family: var(--mono); font-size: 9px; color: rgba(42,58,80,.9); flex-shrink: 0; }
.tech-val { font-family: var(--mono); font-size: 9px; color: rgba(34,90,60,.9); text-align: right; word-break: break-all; max-width: 180px; cursor: pointer; }
.tech-val.ok { color: rgba(34,197,94,.55); }
.tech-divider { border: none; border-top: 1px solid rgba(17,25,38,.8); margin: 8px 0; }
.tech-verify-btn { width: 100%; display: flex; align-items: center; justify-content: center; gap: 5px; background: rgba(34,197,94,.03); border: 1px solid rgba(34,197,94,.09); border-radius: 5px; padding: 7px 0; cursor: pointer; margin: 8px 0; -webkit-appearance: none; }
.tech-verify-text { font-family: var(--mono); font-size: 9px; color: rgba(34,197,94,.4); letter-spacing: .1em; }

.install-area { padding: 0 18px 6px; }
.install-btn { width: 100%; padding: 11px 0; border-radius: 8px; background: var(--pass-bg); border: 1px solid var(--pass-br); color: var(--pass); font-size: 12px; font-weight: 600; letter-spacing: .05em; cursor: pointer; font-family: var(--sans); -webkit-appearance: none; transition: background .2s; }
.install-btn:active { background: rgba(34,197,94,.14); }

.waiting-msg { padding: 32px 18px; text-align: center; color: var(--text-g); font-size: 12px; line-height: 1.7; }

/* Status bar */
.status-bar { position: fixed; bottom: calc(var(--safe-bot) + 12px); left: 24px; display: flex; align-items: center; gap: 8px; z-index: 20; }
.status-dot { width: 5px; height: 5px; border-radius: 50%; animation: dot-pulse 2s ease-in-out infinite; flex-shrink: 0; }
.status-text { font-family: var(--mono); font-size: 9px; color: var(--text-g); letter-spacing: .08em; }

/* Close button */
.close-btn { position: fixed; top: calc(var(--safe-top) + 16px); right: 20px; width: 36px; height: 36px; border-radius: 50%; background: var(--raised); border: 1px solid var(--border); display: flex; align-items: center; justify-content: center; cursor: pointer; z-index: 20; font-size: 18px; color: var(--text-g); -webkit-appearance: none; }
</style>
</head>
<body>

<!-- IDLE SCREEN -->
<div id="idle-screen" class="screen">
  <div class="h-wrap" id="hBtn" onclick="openPanel()">
    <div class="h-ring"></div>
    <div class="h-ring"></div>
    <div class="h-ring"></div>
    <div class="h-center">
      <span class="h-letter">H</span>
    </div>
  </div>
  <div class="idle-label">HEILLON · DINO GRAVITY</div>
  <div class="idle-sub" id="idleSub">Conectando...</div>
  <div class="idle-counter">
    <div class="live-dot" id="statusDotIdle" style="background:var(--text-g)"></div>
    <span class="idle-events" id="idleEvents">—</span>
  </div>
  <p class="tap-hint">Toque para ver a última decisão</p>
</div>

<!-- PANEL SCREEN -->
<div id="panel-screen" class="screen hidden">
  <div class="panel-sheet" id="panelSheet">
    <div class="panel-handle"></div>
    <div class="panel-header">
      <div class="ph-logo"><span>H</span></div>
      <div>
        <div class="ph-brand">HEILLON</div>
        <div class="ph-sub">DINO GRAVITY</div>
      </div>
      <div class="ph-count" id="phCount">—</div>
    </div>
    <div id="panelContent">
      <div class="waiting-msg">Conectando ao backend soberano...<br><span style="font-size:9px;opacity:.5">polling a cada 3 segundos</span></div>
    </div>
  </div>
</div>

<!-- Status bar (always visible) -->
<div class="status-bar" id="statusBar">
  <div class="status-dot" id="statusDot" style="background:var(--text-g)"></div>
  <span class="status-text" id="statusText">Conectando...</span>
</div>

<!-- Close button (panel only) -->
<button class="close-btn hidden" id="closeBtn" onclick="closePanel()">×</button>

<script>
const BASE = 'https://heilloncommandcenter-production.up.railway.app';
let panelOpen = false, lastHdrId = null, currentDecision = null;
let elapsed = 0, elapsedTimer = null, gateTimers = [];
let techOpen = false, fullData = {};

function openPanel() {
  panelOpen = true;
  document.getElementById('idle-screen').classList.add('hidden');
  document.getElementById('panel-screen').classList.remove('hidden');
  document.getElementById('closeBtn').classList.remove('hidden');
  if (currentDecision) renderDecision(currentDecision);
  // Haptic
  if (navigator.vibrate) navigator.vibrate(30);
}

function closePanel() {
  panelOpen = false;
  document.getElementById('panel-screen').classList.add('hidden');
  document.getElementById('idle-screen').classList.remove('hidden');
  document.getElementById('closeBtn').classList.add('hidden');
  if (navigator.vibrate) navigator.vibrate(15);
}

function setGate(i, a) {
  const rows = document.querySelectorAll('.gate-row');
  if (rows[i]) rows[i].classList.toggle('active', a);
}
function animateGates() {
  gateTimers.forEach(clearTimeout); gateTimers = [];
  setGate(0,false); setGate(1,false); setGate(2,false);
  gateTimers.push(setTimeout(() => setGate(0,true), 200));
  gateTimers.push(setTimeout(() => setGate(1,true), 450));
  gateTimers.push(setTimeout(() => setGate(2,true), 720));
}

function fmt(s) { return s < 60 ? s+'s atrás' : Math.floor(s/60)+'m atrás'; }
function trunc(s, n) { if(!s||s==='—')return'—'; s=String(s); return s.length>n?s.slice(0,n)+'…':s; }
function updateElapsed() { const el=document.getElementById('elapsedSpan'); if(el) el.textContent=fmt(elapsed); }

function toggleTech() {
  techOpen = !techOpen;
  const arrow = document.getElementById('techArrow');
  const label = document.getElementById('techToggleText');
  const panel = document.getElementById('techPanel');
  if(arrow) arrow.className='tech-arrow'+(techOpen?' open':'');
  if(label) label.textContent = techOpen?'OCULTAR':'VER DETALHES TÉCNICOS';
  if(panel) { if(techOpen){panel.style.display='block';buildTech();}else{panel.style.display='none';} }
}

function buildTech() {
  const p = document.getElementById('techPanel');
  if(!p||!currentDecision) return;
  const d = currentDecision, f = fullData;
  const eHash = f.proof?.hash||'—';
  const pHash = f.proof?.previous_hash||'—';
  const eId = f.event_id||'—';
  const eType = f.event_type||'INSTITUTIONAL_DECISION_ISSUED';
  const tsMs = f.proof?.timestamp_sovereign||'—';
  const cHash = f.corpus_hash||'—';
  const cert = f.cert||{};
  const ctx = f.intent?.context||{};
  const ctxRows = Object.entries(ctx).slice(0,3).map(([k,v])=>`<div class="tech-row"><span class="tech-key">ctx.${k}</span><span class="tech-val">${trunc(String(v),20)}</span></div>`).join('');
  p.innerHTML=`
    <div class="tech-section-lbl">PROVA CRIPTOGRÁFICA</div>
    <div class="tech-row"><span class="tech-key">event_id</span><span class="tech-val">${trunc(eId,24)}</span></div>
    <div class="tech-row"><span class="tech-key">event_hash</span><span class="tech-val" onclick="cp('${eHash}')" title="Copiar">${trunc(eHash,20)} ↗</span></div>
    <div class="tech-row"><span class="tech-key">prev_hash</span><span class="tech-val" onclick="cp('${pHash}')" title="Copiar">${trunc(pHash,20)} ↗</span></div>
    <div class="tech-row"><span class="tech-key">timestamp_ms</span><span class="tech-val">${tsMs}</span></div>
    <div class="tech-row"><span class="tech-key">chain</span><span class="tech-val ok">${f.proof?.hash_chain||'INTACT'}</span></div>
    <hr class="tech-divider">
    <div class="tech-section-lbl">CONTEXTO DA AÇÃO</div>
    <div class="tech-row"><span class="tech-key">actor_id</span><span class="tech-val">${trunc(f.intent?.actor_id||d.actorId||'—',22)}</span></div>
    <div class="tech-row"><span class="tech-key">actor_type</span><span class="tech-val">${f.intent?.actor_type||d.actorType||'—'}</span></div>
    <div class="tech-row"><span class="tech-key">action</span><span class="tech-val">${f.intent?.action||d.action||'—'}</span></div>
    <div class="tech-row"><span class="tech-key">domain</span><span class="tech-val">${f.intent?.domain||'—'}</span></div>
    <div class="tech-row"><span class="tech-key">nlo_required</span><span class="tech-val">${f.intent?.nlo_required??'—'}</span></div>
    ${ctxRows}
    <hr class="tech-divider">
    <div class="tech-section-lbl">ESTADO CONSTITUCIONAL</div>
    <div class="tech-row"><span class="tech-key">corpus_hash</span><span class="tech-val" onclick="cp('${cHash}')" title="Copiar">${trunc(cHash,20)} ↗</span></div>
    <div class="tech-row"><span class="tech-key">event_type</span><span class="tech-val">${trunc(eType,26)}</span></div>
    <div class="tech-row"><span class="tech-key">policy_ver</span><span class="tech-val">${cert.policy_version||'v1.0.0'}</span></div>
    <div class="tech-row"><span class="tech-key">guard_ver</span><span class="tech-val">${cert.guard_version||'v1.0.0'}</span></div>
    <button class="tech-verify-btn" onclick="openVerify()"><span class="tech-verify-text">VERIFICAR OFFLINE  ↗</span></button>`;
}

function cp(text) {
  if(!text||text==='—') return;
  navigator.clipboard?.writeText(text).catch(()=>{});
  if(navigator.vibrate) navigator.vibrate(20);
}
function openVerify() {
  if(currentDecision?.id) window.open(`${BASE}/public/verify/${currentDecision.id}`, '_blank');
}

function renderDecision(d) {
  const bl = ['denied','BLOCKED','blocked','escalated'].includes(d.verdict);
  const hBtn = document.getElementById('hBtn');
  if(hBtn) hBtn.className = 'h-wrap' + (bl?' blocked':'');
  const norms = (d.norms&&d.norms.length) ? d.norms.map(n=>`<span class="norm-tag">${n}</span>`).join('') : '<span class="norm-tag">BCB 4.557</span><span class="norm-tag">LGPD Art.20</span>';
  const phCount = document.getElementById('phCount');
  document.getElementById('panelContent').innerHTML = `
    <div class="verdict-row"><div class="verdict-badge ${bl?'block':'allow'}"><span class="verdict-dot"></span><span class="verdict-text">${bl?'BLOCKED':'ALLOW'}</span></div></div>
    <div class="intent-section"><div class="sec-label">INTENÇÃO DECLARADA</div><div class="intent-text">${d.intent||'Ação registrada'}</div><div class="intent-meta">${d.actorType||'AI'} · ${d.action||'—'}</div></div>
    <div class="gates-section"><div class="sec-label">PORTÃO CONSTITUCIONAL</div>
      <div class="gate-row"><div class="gate-box"><div class="gate-check"></div></div><span class="gate-label">Autoridade validada</span></div>
      <div class="gate-row"><div class="gate-box"><div class="gate-check"></div></div><span class="gate-label">Políticas respeitadas</span></div>
      <div class="gate-row"><div class="gate-box"><div class="gate-check"></div></div><span class="gate-label">Risco dentro dos limites</span></div>
    </div>
    <div class="norms-section"><div class="sec-label">NORMAS VIGENTES</div><div class="norm-tags">${norms}</div></div>
    <div class="footer-section">
      <div class="footer-meta"><span id="elapsedSpan">há pouco</span><span>${d.chain||'INTACT'}</span></div>
      <button class="hdr-btn" onclick="copyHdr()"><span class="hdr-id">${d.id||'—'}</span><span class="copy-icon" id="copyIcon">↗</span></button>
      <button class="tech-toggle" onclick="toggleTech()"><span class="tech-toggle-text" id="techToggleText">VER DETALHES TÉCNICOS</span><span class="tech-arrow" id="techArrow">▾</span></button>
    </div>
    <div class="tech-panel" id="techPanel" style="display:none"></div>
    <div class="install-area"><button class="install-btn" onclick="promptInstall()">Instalar Companion</button></div>`;
  techOpen = false;
  animateGates();
  updateElapsed();
}

function copyHdr() {
  if(currentDecision?.id) { navigator.clipboard?.writeText(currentDecision.id).catch(()=>{}); if(navigator.vibrate) navigator.vibrate([30,20,30]); }
  const ic = document.getElementById('copyIcon');
  if(ic) { ic.textContent='✓'; ic.className='copy-icon ok'; setTimeout(()=>{ic.textContent='↗';ic.className='copy-icon';},1800); }
}

let deferredPrompt = null;
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); deferredPrompt = e; });
function promptInstall() {
  if(deferredPrompt) { deferredPrompt.prompt(); deferredPrompt.userChoice.then(()=>{ deferredPrompt=null; }); }
  else { alert('Para instalar:\n\n📱 iOS: Safari → Compartilhar → Adicionar à Tela de Início\n🤖 Android: Menu → Adicionar à tela inicial\n💻 Desktop: ícone ⊕ na barra de endereço'); }
}

function triggerNew() {
  const btn = document.getElementById('hBtn');
  if(btn) { btn.classList.add('pulsed'); setTimeout(()=>btn.classList.remove('pulsed'),600); }
  if(navigator.vibrate) navigator.vibrate([50,30,80]);
}

async function poll() {
  try {
    const r = await fetch(`${BASE}/crl/state`);
    const d = await r.json();
    const id = d.ledger?.last_hdr_id;
    const tot = d.ledger?.total_events||0;

    // Update UI
    document.getElementById('statusDot').style.background = 'var(--pass)';
    document.getElementById('statusDotIdle').style.background = 'var(--pass)';
    document.getElementById('statusText').textContent = 'CONSTITUTIONAL_ACTIVE · '+tot+' decisões';
    document.getElementById('idleSub').textContent = tot+' decisões soberanas';
    document.getElementById('idleEvents').textContent = '#'+tot;
    const phc = document.getElementById('phCount');
    if(phc) phc.textContent = '#'+tot;

    if(id && id !== lastHdrId) {
      lastHdrId = id; elapsed = 0;
      clearInterval(elapsedTimer);
      elapsedTimer = setInterval(()=>{elapsed++;updateElapsed();}, 1000);
      triggerNew();

      try {
        const [vr, cr] = await Promise.all([
          fetch(`${BASE}/public/verify/${id}`),
          fetch(`${BASE}/guard/v1/certificate/${id}?format=json`)
        ]);
        const hdr = await vr.json();
        let cert = {}; try{cert = await cr.json();}catch(_){}
        let norms = [];
        try { const nr = await fetch(`${BASE}/hdr/${id}/context`); const nd = await nr.json(); norms = (nd.norms||[]).slice(0,3).map(n=>(n.code||'').split('(')[0].trim()); } catch(_) {}
        fullData = {...hdr, corpus_hash: cert.corpus_hash||d.ledger?.last_event_hash||'', cert};
        currentDecision = {id, verdict: hdr.verdict||'approved', intent: hdr.intent?.intent||'Ação registrada pelo LC²S', actorType: hdr.intent?.actor_type||'AI', actorId: hdr.intent?.actor_id||'—', action: hdr.intent?.action||'—', chain: hdr.proof?.hash_chain||'INTACT', norms};
        if(panelOpen) { const wm=document.querySelector('.waiting-msg'); if(wm) document.getElementById('panelContent').innerHTML=''; renderDecision(currentDecision); }
      } catch(_) {}
    }
  } catch(e) {
    document.getElementById('statusDot').style.background = 'var(--fail)';
    document.getElementById('statusDotIdle').style.background = 'var(--fail)';
    document.getElementById('statusText').textContent = 'Reconectando...';
    document.getElementById('idleSub').textContent = 'Sem conexão';
  }
}

// Service Worker
if('serviceWorker' in navigator) {
  navigator.serviceWorker.register('/sw.js').catch(()=>{});
}

poll();
setInterval(poll, 3000);

// Swipe down to close panel
let touchStartY = 0;
document.addEventListener('touchstart', e => { touchStartY = e.touches[0].clientY; }, {passive:true});
document.addEventListener('touchmove', e => {
  if(!panelOpen) return;
  const dy = e.touches[0].clientY - touchStartY;
  if(dy > 80) closePanel();
}, {passive:true});
</script>
</body>
