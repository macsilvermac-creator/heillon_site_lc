<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<title>HEILLON HPC — Personal Core</title>
</head>
<body>
<script>
// Se registado → vai para o dashboard pocket.html
// Se não registado → vai para o gate de registo
(function(){
  try {
    var reg = localStorage.getItem('hpc_registered_v1');
    if (reg) {
      window.location.replace('/pocket.html');
    } else {
      window.location.replace('/hpc-gate.html');
    }
  } catch(e) {
    window.location.replace('/hpc-gate.html');
  }
})();
</script>
<p>A carregar HEILLON HPC...</p>
</body>
</html>
